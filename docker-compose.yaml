name: infrastructure-services

services:
  # =============================================================================
  # MYSQL/MARIADB SERVICE
  # =============================================================================
  mysql-dev:
    image: mysql:8.4
    container_name: dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dev-infrastructure

  # =============================================================================
  # MARIADB SERVICE (alternativa a MySQL)
  # =============================================================================
  mariadb-dev:
    image: mariadb:11.4
    container_name: dev-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dev-infrastructure

  # =============================================================================
  # POSTGRESQL SERVICE
  # =============================================================================
  postgres-dev:
    image: postgres:16
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-infrastructure

  # =============================================================================
  # SQL SERVER SERVICE
  # =============================================================================
  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dev-sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - dev-infrastructure

  # =============================================================================
  # MONGODB SERVICE
  # =============================================================================
  mongodb-dev:
    image: mongo:8.0
    container_name: dev-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - dev-infrastructure

  # =============================================================================
  # REDIS SERVICE
  # =============================================================================
  redis-dev:
    image: redis:7.4-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-infrastructure

  # =============================================================================
  # PGADMIN SERVICE (Para administrar PostgreSQL)
  # =============================================================================
  pgadmin-dev:
    image: dpage/pgadmin4:latest
    container_name: dev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dev-infrastructure
    depends_on:
      - postgres-dev

  # --- MENSAJERÍA (Eventos de subastas) ---
  # Usamos KRaft (sin Zookeeper) para ahorrar recursos
  kafka-dev:
    image: apache/kafka:4.1.1
    container_name: dev-kafka
    ports:
      - "9092:9092" # Puerto interno para otros contenedores
      - "${KAFKA_EXTERNAL_PORT}:9093" # Puerto externo para clientes en el host
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-dev:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      - KAFKA_BROKER_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9094
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
    networks:
      - dev-infrastructure

  # --- UI PARA KAFKA (Opcional, pero te ayudará mucho a ver los mensajes) ---
  kafka-ui-dev:
    image: provectuslabs/kafka-ui:latest
    container_name: dev-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_UI_BOOTSTRAP_SERVERS}
    networks:
      - dev-infrastructure
    depends_on:
      - kafka-dev
# =============================================================================
# VOLUMES PARA PERSISTENCIA DE DATOS
# =============================================================================
volumes:
  mysql_data:
    driver: local
  mariadb_data:
    driver: local
  postgres_data:
    driver: local
  sqlserver_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================
networks:
  dev-infrastructure:
    driver: bridge
    external: false
